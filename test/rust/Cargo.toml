[package]
name = "ouinet-test-rs"
version = "0.1.0"
edition = "2024"

[lib]
test = false

[dependencies]
anyhow = "1.0"
# btdht = { git = "https://github.com/equalitie/btdht.git" }
btdht = { path = "../../../btdht" }
cxx = "1.0"
futures-util = "0.3.32"
reqwest = "0.13.3"
tempfile = "3.27.0"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.2"
warp = { version = "0.4.1", features = ["server"] }

[target.'cfg(target_os = "linux")'.dependencies]
ctor = "1.0"
patchbay = "0.5.2"

[build-dependencies]
cxx-build = "1.0"
