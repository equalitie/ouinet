[package]
name = "ouinet-test-rs"
version = "0.1.0"
edition = "2024"

[lib]
test = false

[dependencies]
anyhow = "1.0"
btdht = { git = "https://github.com/equalitie/btdht.git" }
cxx = "1.0"
env_logger = "0.11.10"
log = "0.4.29"
reqwest = "0.13.3"
tempfile = "3.27.0"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt"] }
warp = { version = "0.4.1", features = ["server"] }

[build-dependencies]
cxx-build = "1.0"
