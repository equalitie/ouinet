docker / build:
  stage: build
  tags:
    - shell+docker
  script:
    - BRANCH="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
    - echo $BRANCH
    - >
      docker build --progress=plain --pull
      --build-arg OUINET_VERSION=${BRANCH}
      -t equalitie/ouinet:${CI_JOB_SLUG}
      - < Dockerfile
    - docker image rm equalitie/ouinet:${CI_JOB_SLUG}
  needs: []
  rules:
     - !reference [.optional_job, rules]
