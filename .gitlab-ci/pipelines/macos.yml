include:
  - .gitlab-ci/common/prepare-macos-image.yml

variables:
  BUILD_PATH: 'build.darwin/build-mac_arm64/Debug'
  BOOST_PATH: 'build.darwin/build-mac_arm64/boost/src/built_boost'
  GCRYPT_PATH: 'build.darwin/build-mac_arm64/gcrypt/src/gcrypt'
  GPGERROR_PATH: 'build.darwin/build-mac_arm64/gpg_error/src/gpg_error'
  HOMEBREW_NO_AUTO_UPDATE: 1

macos / build:
  stage: build
  extends:
    - .prepare-macos-image
  artifacts:
    paths:
      - $BUILD_PATH/client.app
      - $BUILD_PATH/injector.app
      - $BUILD_PATH/lib*.dylib
      - $BUILD_PATH/lib*.a
      - $BOOST_PATH/b2
      - $GCRYPT_PATH/cipher/gost-s-box
      - $GCRYPT_PATH/doc/yat2m
      - $GCRYPT_PATH/tests/testdrv-build
      - $GPGERROR_PATH/doc/yat2m-for-build
      - $GPGERROR_PATH/src/mkerrcodes
      - $GPGERROR_PATH/src/mkheader
      - build.darwin/xcodebuild.log
    expire_in: 6h
  before_script:
    - curl -sL "https://github.com/Kitware/CMake/releases/download/v3.31.12/cmake-3.31.12-macos-universal.tar.gz" -o ~/cmake-macos.tar.gz
    - tar -xf ~/cmake-macos.tar.gz -C ~/.
    - cp -R ~/cmake-3.31.12-macos-universal/CMake.app /Applications/
    - sudo "/Applications/CMake.app/Contents/bin/cmake-gui" --install=/usr/local/bin
    - brew install ruby
    - gem install xcpretty
  script:
    - mkdir -p build.darwin
    - cd build.darwin
    - PLATFORM=MAC_ARM64 ../scripts/build-darwin.sh | tee xcodebuild.log | xcpretty
  when: manual
  allow_failure: true
