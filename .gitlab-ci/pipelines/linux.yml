linux / build:
  stage: build
  tags:
    - shell+docker
  variables:
    BUILD_PATH: 'build'
    TARGET_OS: 'linux'
  script:
    - ./docker/linux.sh --target-os $TARGET_OS --artifact-dir $BUILD_PATH $CONTAINER_ARGS
  artifacts:
    paths:
      - $BUILD_PATH/$TARGET_OS/client
      - $BUILD_PATH/$TARGET_OS/injector
      - $BUILD_PATH/$TARGET_OS/lib*.so*
    expire_in: 6h

linux / cpp-rust-tests:
  stage: test
  tags:
    - shell+docker
  timeout: 30 minutes
  script:
    - ./docker/linux.sh --target-os linux --run-all-tests
  needs:
    - job: 'linux / build'
      artifacts: false

linux / python-tests:
  stage: test
  timeout: 30 minutes
  tags:
    - shell+docker
  script:
    - ./docker/linux.sh --target-os linux --run-python-tests
  needs:
    - job: 'linux / cpp-rust-tests'
      artifacts: false

