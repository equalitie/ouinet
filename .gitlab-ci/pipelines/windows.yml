windows / build:
  stage: build
  tags:
    - shell+docker
  variables:
    BUILD_PATH: 'build'
    TARGET_OS: 'windows'
  script:
    - ./docker/linux.sh --target-os $TARGET_OS --artifact-dir $BUILD_PATH
  artifacts:
    paths:
      - $BUILD_PATH/$TARGET_OS/client.exe
      - $BUILD_PATH/$TARGET_OS/injector.exe
      - $BUILD_PATH/$TARGET_OS/lib*.dll*
    expire_in: 6h

windows / cpp-rust-tests:
  stage: test
  tags:
    - shell+docker
  timeout: 30 minutes
  script:
    - ./docker/linux.sh --target-os windows --run-all-tests
  needs:
    - job: 'windows / build'
      artifacts: false

