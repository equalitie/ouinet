windows / build:
  stage: build
  tags:
    - shell+docker
  variables:
    BUILD_PATH: 'build'
    TARGET_OS: 'windows'
    CMAKE_BUILD_TYPE: 'Release'
  script:
    - >
      ./docker/linux.sh
      --target-os $TARGET_OS
      --artifact-dir windows
      --cmake-build-type $CMAKE_BUILD_TYPE
      --with-ouisync
      $CONTAINER_ARGS
  artifacts:
    paths:
      - $BUILD_PATH/$TARGET_OS/client.exe
      - $BUILD_PATH/$TARGET_OS/injector.exe
      - $BUILD_PATH/$TARGET_OS/lib*.dll*
    expire_in: 6h
  rules:
     - !reference [.optional_job, rules]

windows / cpp-rust-tests:
  stage: test
  tags:
    - shell+docker
  timeout: 60 minutes
  script:
    - |
      excluded_cpp_tests=(
        test_fetch
        test_http_store
        # TODO: Ignoring test_ouisync because tests run with Wine and quinn-rs
        # has issues with it
        test_ouisync
        # TODO: I2P tests don't work well yet without an already running and
        # bootstrapped I2P service on the machine.
        test_i2p
        test_i2p_fetch
        test_i2p_tracker
        # TODO: This one does not use Boost.Test framework and as such requires
        # different command line arguments.
        test_transport
      )
      ./docker/linux.sh \
        --target-os windows \
        --with-ouisync \
        --run-all-tests \
        ${excluded_cpp_tests[@]/#/--exclude-test } \
        $CONTAINER_ARGS
  needs:
    - job: 'windows / build'
      artifacts: false
  rules:
     - !reference [.optional_job, rules]

